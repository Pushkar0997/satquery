services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      SATQUERY_STORAGE_DIR: /app/storage
      SATQUERY_DEMO_MODE: "true"
    volumes:
      - ./storage:/app/storage
  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      SATQUERY_API_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
